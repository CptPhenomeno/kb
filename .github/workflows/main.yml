on:
  workflow_dispatch: 
  push:
    branches:
      - main
      - develop

permissions:
  contents: read 

jobs:
  check-kb:
    name: Run check on kb
    runs-on: ubuntu-slim
    steps:
    # Checkout repository
    - name: Checkout kb
      uses: actions/checkout@v7.0.1

    # Setup Go
    - name: Setup Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26'
        go-version-file: 'go.mod'
        check-latest: false
        token: ${{ github.token }}
        cache: true
        cache-dependency-path: 'go.sum'

    # Run 'make check'
    - name: Run 'make check'
      run: 'make check'
