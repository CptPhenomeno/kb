on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  run-deploy:
    name: Deploy kb
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: ./.github/actions/setup-and-check

      - name: Create binaries
        run: make cross

      - name: Compute Checksums
        run: cd dist && sha256sum kb-* > checksums.txt

      - name: Extract release notes
        run: ./.github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > release.md

      - name: Create Github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file release.md dist/kb* dist/checksums.txt
